name: Update Keywords

on:
  schedule:
    - cron: "* * * * *"

jobs:
  update_keywords:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Update Keywords
        run: node assets/update_keywords.js

      - name: Configure Git
        run: |
          git config --global user.name "xzr3"
          git config --global user.email "ammaryousaf341@gmail.com"
        
      - name: Commit and Push Changes
        run: |
            git add .
            git commit -m "Update meta keywords"
            git remote set-url origin https://xzr3:${{ secrets.GITHUB_TOKEN }}@github.com/xzr3/movies321.git
            git push      
