name: Update Keywords

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update_keywords:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Update Keywords
        run: node assets/update_keywords.js

      - name: Configure Git
        run: |
          git config --global user.name "${GIT_USER_NAME}"
          git config --global user.email "${GIT_USER_EMAIL}"      

      - name: Commit and Push Changes
        run: |
          git add .
          git commit -m "Update meta keywords"
          git remote set-url --push origin https://xzr3:${GITHUB_ACCESS_TOKEN}@github.com/xzr3/movies321.git
          git push
